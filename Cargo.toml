[package]
name = "psd-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
  "glow",
  "wayland",
  "default_fonts",
] }
memmap2 = "0.9"
raw-window-handle = "0.6"
rfd = "0.17"
# eframe と同じ版。イベントループを自前で作るために使う
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"

# 手元での確認用。LTO なしにして再ビルドを速くする（合成速度はほぼ変わらない）
[profile.release]
panic = "abort"
strip = true

# 配布用（nix build と GitHub Actions）。ビルドは遅いがバイナリが小さい
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# 合成処理はデバッグビルドだと極端に遅いので、依存と自前コードを最適化しておく
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
